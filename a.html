<!DOCTYPE html>
<html>
<head>
<title>My Friend 😎</title>
<style>
body{
  background:#111;color:white;text-align:center;
  font-family:Arial;padding:50px;
}
h1{color:#00ffff;animation:glow 1s infinite alternate}
.card{
  background:#222;padding:20px;border-radius:20px;
  margin:20px auto;max-width:350px;
  animation:up 2s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 5px cyan}
  to{text-shadow:0 0 25px cyan}
}
@keyframes up{
  from{transform:translateY(0)}
  to{transform:translateY(-8px)}
}
</style>
</head>

<body>

<h1>😎 My Noobri Friend</h1>

<div class="card">
<h2>About shee 😂</h2>
<p>Naam: AMRITA  </p>
<p>Baton se cute lagti hai or thori pagal bhi🤣</p>
</div>

<div class="card">
<h2>Good 👍 / Bad 😂</h2>
<p>❤️ game me mere liye gun dhundh kar lati hai </p>
<p>😴 Noobri hai </p>
<p>📱 chai banati rahti hai bechari </p>
</div>

<h2>❤️ But Still My Best Friend!</h2>

</body>
</html>
